name: CRMPhoneAgent
options:
  bundleIdPrefix: lt.crmphone
  deploymentTarget:
    iOS: "17.5"
packages:
  TelnyxRTC:
    url: https://github.com/team-telnyx/telnyx-webrtc-ios.git
    revision: 7e19b535f58a0969a6edaf5105ac575b20fe8cec
targets:
  CRMPhoneAgent:
    type: application
    platform: iOS
    sources: [Sources]
    dependencies:
      - package: TelnyxRTC
        product: telnyx-webrtc-ios
      - framework: Vendor/CRMPhoneBaresip.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: lt.crmphone.agent
        SWIFT_VERSION: 5.10
        SWIFT_OBJC_BRIDGING_HEADER: Sources/CRMPhoneAgent-Bridging-Header.h
        OTHER_LDFLAGS: $(inherited) -lresolv -framework CoreAudio -framework AudioToolbox -framework AVFoundation -framework CoreMedia -framework SystemConfiguration
        CODE_SIGN_ENTITLEMENTS: CRMPhoneAgent.entitlements
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Info.plist
        SUPPORTS_MACCATALYST: NO
        TARGETED_DEVICE_FAMILY: 1
