name: Build iOS CRM Phone

on:
  workflow_dispatch:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/build-ios.yml"

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Install gateway test dependencies
        run: python3 -m pip install -r distribution/sip_gateway/requirements.txt
      - name: Build BSD SIP engine
        working-directory: ios/CRMPhoneAgent
        run: bash scripts/build_baresip_xcframework.sh
      - name: Verify SIP engine slices
        working-directory: ios/CRMPhoneAgent
        run: >-
          test -f Vendor/CRMPhoneBaresip.xcframework/Info.plist &&
          plutil -lint Vendor/CRMPhoneBaresip.xcframework/Info.plist
      - name: Generate project
        working-directory: ios/CRMPhoneAgent
        run: xcodegen generate
      - name: Validate integration contract
        run: python3 distribution/validate_ios_crm_phone.py
      - name: Test Tele2, gateway, and Asterisk adapters
        run: >-
          python3 -m unittest
          distribution.sip_gateway.test_asterisk_agi
          distribution.sip_gateway.test_gateway
          distribution.test_tele2_mobile_station_adapter
          distribution.test_cloudtalk_adapter
      - name: Build without signing
        working-directory: ios/CRMPhoneAgent
        run: >-
          xcodebuild
          -project CRMPhoneAgent.xcodeproj
          -scheme CRMPhoneAgent
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -resultBundlePath "$RUNNER_TEMP/CRMPhoneAgent.xcresult"
          CODE_SIGNING_ALLOWED=NO
          build
      - name: Upload Xcode result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CRMPhoneAgent-xcresult
          path: ${{ runner.temp }}/CRMPhoneAgent.xcresult
          if-no-files-found: ignore
